# Install as /etc/ssh/sshd_config.d/00-cloudstack.conf
# Owner: root:root; mode: 0600
# Direct root password SSH is enabled only because it is a project requirement.

PermitRootLogin yes
PasswordAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no
KbdInteractiveAuthentication no
UsePAM yes
