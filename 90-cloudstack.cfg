#cloud-config
# Install as /etc/cloud/cloud.cfg.d/90-cloudstack.cfg
# Owner: root:root; mode: 0644

datasource_list:
  - CloudStack
  - ConfigDrive
  - None

datasource:
  CloudStack:
    max_wait: 120
    timeout: 10

preserve_hostname: false
manage_etc_hosts: true

disable_root: false
ssh_pwauth: true

system_info:
  default_user:
    name: root
    lock_passwd: true
    shell: /bin/bash
